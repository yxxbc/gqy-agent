<!doctype html>
<!--
  桌面悬浮窗的页面(src/pet/web/index.html,编译进二进制)。

  这块页面只做三件事:把立绘画出来、给它一点活气(呼吸、淡入)、把鼠标动作
  翻成指令发回 Rust 侧(window.ipc.postMessage)。立绘由 page.rs 以 data URI
  内联进来,页面不发任何网络请求、不加载任何外部资源。

  指令(cmd):drag(原生拖窗)、open_webui(双击)、close(✕ / Esc)。
-->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>顾清影</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      /* 窗口是透明的,任何一层不透明底色都会露成一块方块。 */
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      cursor: grab;
    }
    body.is-dragging {
      cursor: grabbing;
    }

    /* 立绘贴底居中,上方留白给动效(窗口高度里已含 HEADROOM)。 */
    #stage {
      position: relative;
      display: grid;
      height: 100%;
      align-items: end;
      justify-items: center;
      /* 淡入:窗口先隐藏,WebView 就位后才有内容,露出来时不该是硬切。 */
      animation: appear 420ms ease-out both;
    }
    /* 人物:有模型时是 canvas,没有时是立绘——两者都装在这一层里,呼吸与
       状态光晕加在层上,免得两处各写一份。 */
    .pet-visual {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: end center;
      animation: breathe 5.2s ease-in-out infinite;
      transform-origin: 50% 100%;
      filter: drop-shadow(0 10px 16px rgb(0 0 0 / 35%));
    }
    #live2d,
    #live2d canvas {
      display: block;
      width: 100%;
      height: 100%;
      /* 透明窗里画布自己不能有底色:pixi 的底由 backgroundAlpha 管,这里再补一道
         CSS 保险(某些绘制路径上 canvas 会自己填白)。 */
      background: transparent;
    }
    #portrait {
      display: block;
      max-width: 100%;
      max-height: 100%;
      -webkit-user-drag: none;
    }
    /* 模型自己会呼吸会眨眼:整层的呼吸让位,两套动作叠在一起会像在抖。 */
    body.has-model .pet-visual { animation: none; }
    body.has-model #portrait { display: none; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.012); }
    }
    @media (prefers-reduced-motion: reduce) {
      #stage, #pet { animation: none; }
    }

    /* 关掉它的小 ✕:常显(半透明),鼠标进来变亮。
       Accessory 策略下窗口不一定拿得到键盘焦点,Esc 不能当唯一出口。 */
    #close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 50%;
      background: rgb(0 0 0 / 45%);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 140ms ease;
    }
    body:hover #close {
      opacity: 1;
    }

    /* 左下角的状态点:闲着是淡白点,在想是蓝色呼吸,在说话是暖金。
       她的状态由 daemon 经 IPC 推来(见 src/pet/ipc.rs),页面只负责表现。 */
    #dot {
      position: absolute;
      left: 10px;
      bottom: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgb(255 255 255 / 45%);
      transition: background-color 260ms ease;
    }
    #dot.is-thinking { background: #8ab4ff; animation: pulse 1.4s ease-in-out infinite; }
    #dot.is-speaking { background: #e0b973; animation: pulse 0.7s ease-in-out infinite; }
    @keyframes pulse {
      50% { opacity: 0.35; }
    }
    /* 说话时人物外面浮一层暖光,在想是冷光。现在只有这张图/这个模型能表达
       "她在说",Cubism 接上之后嘴型由这里驱动(见 app.js 的 driveMouth)。 */
    body[data-state="speaking"] .pet-visual {
      filter: drop-shadow(0 10px 16px rgb(0 0 0 / 35%)) drop-shadow(0 0 16px rgb(224 185 115 / 40%));
    }
    body[data-state="thinking"] .pet-visual {
      filter: drop-shadow(0 10px 16px rgb(0 0 0 / 35%)) drop-shadow(0 0 14px rgb(138 180 255 / 32%));
    }

    /* 右键菜单:页内画,不引系统菜单(窗口是无边框的,原生菜单还得自己摆位置)。
       菜单要有自己的不透明底——它是这个透明窗里唯一该挡住底层东西的地方。 */
    #menu {
      position: absolute;
      z-index: 10;
      display: grid;
      min-width: 130px;
      padding: 4px;
      border-radius: var(--pet-menu-radius, 8px);
      background: rgb(30 30 34 / 96%);
      box-shadow: 0 10px 26px rgb(0 0 0 / 45%);
      color: #f2f2f5;
      font-size: 12px;
      line-height: 1.2;
    }
    #menu[hidden] { display: none; }
    #menu button {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: inherit;
      font: inherit;
      gap: 6px;
      text-align: left;
      cursor: pointer;
    }
    #menu button:hover:not(:disabled) { background: rgb(255 255 255 / 12%); }
    #menu button:disabled { opacity: 0.4; cursor: default; }
    #menu .check { width: 11px; flex: none; color: #8ab4ff; }
    #menu hr { margin: 4px 6px; border: 0; border-top: 1px solid rgb(255 255 255 / 14%); }
  </style>
</head>
<body>
  <div id="stage">
    <div class="pet-visual">
      <div id="live2d"></div>
      <img id="portrait" src="./portrait.png" alt="顾清影" draggable="false">
    </div>
    <button id="close" type="button" title="关掉悬浮窗">✕</button>
    <span id="dot"></span>
    <div id="menu" role="menu" hidden>
      <button type="button" role="menuitem" data-act="on_top"><span class="check"></span>置顶</button>
      <button type="button" role="menuitem" data-act="bigger"><span class="check"></span>大一点</button>
      <button type="button" role="menuitem" data-act="smaller"><span class="check"></span>小一点</button>
      <hr>
      <button type="button" role="menuitem" data-act="webui"><span class="check"></span>打开 WebUI</button>
      <button type="button" role="menuitem" data-act="close"><span class="check"></span>关掉悬浮窗</button>
    </div>
  </div>
  <script defer src="./app.js"></script>
</body>
</html>
