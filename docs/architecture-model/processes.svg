<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="664" viewBox="0 0 1500 664" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect width="1500" height="664" fill="#fff"/><text x="26" y="34" font-size="19" font-weight="600" fill="#1B2631">顾清影 gqy — 进程形态与数据归属（L2 Containers）</text><text x="26" y="54" font-size="11.5" fill="#5D6D7E">派生自 gqy.structurizr.dsl 的 L2-Containers 视图 · 2026-09-26 · v0.7.0 / 0041621b</text><text x="1480" y="64" font-size="12.5" font-weight="700" fill="#0F635F" text-anchor="end">软件系统 顾清影 gqy — 六个进程形态 + 七个 store（除 gqy-voice 外同一个二进制）</text><rect x="20" y="74" width="1460" height="512" rx="14" fill="none" stroke="#0F635F" stroke-width="1.7" stroke-dasharray="8 5"/><rect x="60" y="100" width="250" height="82" rx="8" fill="#2E86C1" stroke="#1B4F72" stroke-width="1.2"/><text x="185" y="139" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">gqy CLI</text><text x="185" y="156" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">REPL · ask · shellhook · stdio · TUI</text><rect x="430" y="92" width="300" height="98" rx="8" fill="#083F77" stroke="#04213E" stroke-width="1.2"/><text x="580" y="139" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">gqy __daemon</text><text x="580" y="156" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">唯一跑回合 · 0.0.0.0:8300 · core.sock</text><rect x="830" y="100" width="230" height="82" rx="8" fill="#7D6608" stroke="#5B4A06" stroke-width="1.2"/><text x="945" y="139" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">gqy-voice</text><text x="945" y="156" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">--features voice 才构建</text><path d="M310,141 L430,141" fill="none" stroke="#2E86C1" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><text x="370" y="132" font-size="9.5" fill="#2E86C1" text-anchor="middle" stroke="#fff" stroke-width="3.6" paint-order="stroke">core.sock</text><text x="370" y="156" font-size="8.5" fill="#2E86C1" text-anchor="middle" stroke="#fff" stroke-width="3.6" paint-order="stroke">一连接一回合</text><path d="M730,132 L830,132" fill="none" stroke="#116953" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><text x="780" y="125" font-size="8.5" fill="#116953" text-anchor="middle" stroke="#fff" stroke-width="3.6" paint-order="stroke">spawn</text><path d="M830,152 L730,152" fill="none" stroke="#2E86C1" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><text x="780" y="168" font-size="8.5" fill="#2E86C1" text-anchor="middle" stroke="#fff" stroke-width="3.6" paint-order="stroke">VoiceAttach</text><rect x="60" y="232" width="230" height="66" rx="8" fill="#116953" stroke="#0B4B3B" stroke-width="1.2"/><text x="175" y="263" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">gqy __renderer-worker</text><text x="175" y="280" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">长图 Markdown→PNG · 空闲 10min</text><path d="M600,190 L600,212 L175,212 L175,232" fill="none" stroke="#116953" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><rect x="310" y="232" width="230" height="66" rx="8" fill="#116953" stroke="#0B4B3B" stroke-width="1.2"/><text x="425" y="263" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">gqy __embedding-worker</text><text x="425" y="280" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">ONNX 外置 · 空闲 600s</text><path d="M600,190 L600,212 L425,212 L425,232" fill="none" stroke="#116953" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><rect x="560" y="232" width="230" height="66" rx="8" fill="#116953" stroke="#0B4B3B" stroke-width="1.2"/><text x="675" y="263" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">gqy __alarm-worker</text><text x="675" y="280" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">detached · 活得比 gqy 长</text><path d="M600,190 L600,212 L675,212 L675,232" fill="none" stroke="#116953" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><text x="300" y="206" font-size="9.5" fill="#116953" text-anchor="start" stroke="#fff" stroke-width="3.6" paint-order="stroke">daemon spawn 三个自重生 worker（env 变量 + argv[1] 双条件触发）</text><text x="860" y="264" font-size="10.5" fill="#5D6D7E">RLIMIT_AS 只在 Linux 施加；macOS 上 setrlimit 回 EINVAL 故不设。</text><text x="860" y="284" font-size="10.5" fill="#5D6D7E">daemon 另起外部进程：rg · chafa · sh · git · pacman · gh · notify-send ·</text><text x="860" y="302" font-size="10.5" fill="#5D6D7E">中转线 CLI（claude/codex/agy）· MCP 服务器；成员回合下这些子进程继承同一套 Landlock 规则。</text><path d="M545,190 L545,372" fill="none" stroke="#512D81" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><text x="556" y="336" font-size="9.5" fill="#512D81" text-anchor="start" stroke="#fff" stroke-width="3.6" paint-order="stroke">StoreRegistry 按 principal 路由</text><path d="M138,372 L1362,372" fill="none" stroke="#512D81" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M138,372 L138,424" fill="none" stroke="#512D81" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><rect x="40" y="424" width="196" height="72" rx="8" fill="#512D81" stroke="#3B1E5E" stroke-width="1.2"/><text x="138" y="458" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">conversation.db</text><text x="138" y="475" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">每身份 · 37 版迁移</text><path d="M342,372 L342,424" fill="none" stroke="#512D81" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><rect x="244" y="424" width="196" height="72" rx="8" fill="#512D81" stroke="#3B1E5E" stroke-width="1.2"/><text x="342" y="458" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">memory.db</text><text x="342" y="475" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">每 persona 一份</text><path d="M546,372 L546,424" fill="none" stroke="#512D81" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><rect x="448" y="424" width="196" height="72" rx="8" fill="#512D81" stroke="#3B1E5E" stroke-width="1.2"/><text x="546" y="458" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">evicted_context.db</text><text x="546" y="475" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">逐出回合归档</text><path d="M750,372 L750,424" fill="none" stroke="#512D81" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><rect x="652" y="424" width="196" height="72" rx="8" fill="#512D81" stroke="#3B1E5E" stroke-width="1.2"/><text x="750" y="458" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">ledger.db</text><text x="750" y="475" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">记账自有版本</text><path d="M954,372 L954,424" fill="none" stroke="#512D81" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><rect x="856" y="424" width="196" height="72" rx="8" fill="#512D81" stroke="#3B1E5E" stroke-width="1.2"/><text x="954" y="458" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">kb_meta + semantic</text><text x="954" y="475" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">机器级</text><path d="M1158,372 L1158,424" fill="none" stroke="#512D81" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><rect x="1060" y="424" width="196" height="72" rx="8" fill="#512D81" stroke="#3B1E5E" stroke-width="1.2"/><text x="1158" y="458" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">state/ cache/</text><text x="1158" y="475" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">JSON · JSONL</text><path d="M1362,372 L1362,424" fill="none" stroke="#512D81" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/><rect x="1264" y="424" width="196" height="72" rx="8" fill="#512D81" stroke="#3B1E5E" stroke-width="1.2"/><text x="1362" y="458" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">~/.gqy 目录树</text><text x="1362" y="475" font-size="9.5" fill="#FFFFFF" opacity="0.9" text-anchor="middle">persona · extensions</text><text x="40" y="528" font-size="10.5" fill="#5D6D7E">紫线 = daemon 读写。conversation.db 每身份一份、memory.db 每 persona 一份、kb 机器级不按 persona 切。</text><text x="40" y="548" font-size="10.5" fill="#5D6D7E">不在文件里的一类：提示词、工具描述 JSON、web/ 静态资源、jieba 与 o200k 词表 —— build.rs 编译期进二进制，改完必须重新构建。</text><text x="40" y="568" font-size="10.5" fill="#5D6D7E">没有 pid 文件：daemon 存活靠 IPC Ping + /proc/&lt;pid&gt;/{stat,comm}；端口 8300 被占则退到临时端口。</text><text x="26" y="638" font-size="11" fill="#5D6D7E">蓝=IPC · 绿=起子进程 · 紫=读写数据 · 深蓝=常驻。虚线框是软件系统 gqy 的范围。</text><text x="26" y="657" font-size="11" fill="#922B21">未验证：子代理不经 actor 直接 start_turn（src/tools/subagent.rs:999,1123），跳过了哪些回合闩锁待查。</text></svg>