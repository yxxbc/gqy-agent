# cargo-deny 供应链门禁：CI 的 supply-chain job 跑 `cargo deny check`。
# 本地验证：brew install cargo-deny && cargo deny check（只读 Cargo.lock，不编译）。
# 文档：https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# RustSec 漏洞库。确认不受影响的公告写进 ignore，必须带 reason。
[advisories]
yanked = "deny"
ignore = [
    # 以下三条是「停止维护」通告，不是漏洞，都经上游间接引入，等上游换掉
    { id = "RUSTSEC-2025-0057", reason = "fxhash: 经 jieba-rs 引入，仅 dev-dependency" },
    { id = "RUSTSEC-2024-0436", reason = "paste: 经 tokenizers 间接引入，仅编译期宏" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: 经 fontdb/cosmic-text 间接引入" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# 本项目自己的许可证不在通用白名单里
exceptions = [
    { name = "gqy", allow = ["PolyForm-Noncommercial-1.0.0"] },
]

[bans]
# 同一个 crate 多版本并存很常见（生态升级不同步），只提示不拦
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# 依赖只能来自 crates.io，出现 git 依赖或其他注册表就报红
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
