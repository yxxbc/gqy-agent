name: Test sandbox
description: Point HOME/GQY_HOME/TMPDIR/XDG_* at a throwaway directory so tests never touch real runner data
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # 建在 /tmp 下而不是默认 TMPDIR:macOS runner 的 TMPDIR 是 /var/folders/…/T/，
        # 测试再往里套 tempdir 后 daemon 的 core.sock 路径到 113 字符，超过 macOS
        # AF_UNIX 103 字符上限，daemon 绑不上 socket 直接退出（daemon_reload 集成测试）
        box="$(mktemp -d /tmp/gqy-ci.XXXXXX)"
        mkdir -p "$box"/{home,gqy,tmp,runtime,cache,config,data,state} out/ci
        chmod 700 "$box/runtime"
        {
          echo "CARGO_HOME=$HOME/.cargo"
          echo "RUSTUP_HOME=$HOME/.rustup"
          echo "HOME=$box/home"
          echo "GQY_HOME=$box/gqy"
          echo "TMPDIR=$box/tmp"
          echo "XDG_RUNTIME_DIR=$box/runtime"
          echo "XDG_CACHE_HOME=$box/cache"
          echo "XDG_CONFIG_HOME=$box/config"
          echo "XDG_DATA_HOME=$box/data"
          echo "XDG_STATE_HOME=$box/state"
        } >> "$GITHUB_ENV"
