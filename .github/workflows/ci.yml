name: Source checks

on:
  pull_request:
  push:
    branches: [gqy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the locked formatting toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt
      - name: Check Rust formatting
        run: cargo +1.96.1 fmt --check
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Check the Nix flake
        run: nix flake check --no-build --all-systems

  rust:
    runs-on: ${{ vars.LINUX_X64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        toolchain: ['1.96.1', '1.89.0']
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native development libraries and test runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libssl-dev pkg-config clang cmake ripgrep
      - name: Install the selected Rust toolchain
        env:
          RUST_VERSION: ${{ matrix.toolchain }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      # 测试跑在一次性的 HOME/GQY_HOME/XDG 目录里，碰不到 runner 上的任何真实数据
      - name: Run all isolated tests concurrently
        if: matrix.toolchain == '1.96.1'
        shell: bash
        run: |
          set -euo pipefail
          box="$(mktemp -d)"
          mkdir -p "$box"/{home,gqy,tmp,runtime,cache,config,data,state} out/ci
          chmod 700 "$box/runtime"
          env CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
              HOME="$box/home" GQY_HOME="$box/gqy" TMPDIR="$box/tmp" \
              XDG_RUNTIME_DIR="$box/runtime" XDG_CACHE_HOME="$box/cache" XDG_CONFIG_HOME="$box/config" \
              XDG_DATA_HOME="$box/data" XDG_STATE_HOME="$box/state" \
            cargo test --locked --all-targets 2>&1 | tee out/ci/source-tests.log
          env CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
              HOME="$box/home" GQY_HOME="$box/gqy" TMPDIR="$box/tmp" \
              XDG_RUNTIME_DIR="$box/runtime" XDG_CACHE_HOME="$box/cache" XDG_CONFIG_HOME="$box/config" \
              XDG_DATA_HOME="$box/data" XDG_STATE_HOME="$box/state" \
            cargo test --locked --doc 2>&1 | tee -a out/ci/source-tests.log
      - name: Check the declared MSRV without hiding failures
        if: matrix.toolchain == '1.89.0'
        shell: bash
        run: |
          mkdir -p out/ci
          cargo check --locked --all-targets 2>&1 | tee out/ci/msrv.log
      - name: Preserve check evidence in a mode-preserving archive
        if: always()
        run: |
          mkdir -p out/ci
          tar -czf rust-evidence.tar.gz -C out/ci .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rust-evidence-${{ matrix.toolchain }}
          path: rust-evidence.tar.gz
          compression-level: 0
          if-no-files-found: error
