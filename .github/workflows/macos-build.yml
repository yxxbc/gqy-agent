name: macOS build (manual)

# Standalone native macOS build for the `gqy` core binary and the `gqy-voice`
# front end.
#
# This is deliberately separate from the controlled Linux release pipeline
# (release.yml), which stays Linux-only: packaging/ci/build.py refuses
# macos-arm64 outright because it builds inside a pinned container. It compiles
# the aarch64-apple-darwin target on a native Apple-silicon runner, assembles
# unsigned tarballs that mirror the release staging layout, and uploads them as
# CI artifacts. It does not sign, notarize, verify against live providers, or
# publish.
#
# Core and voice are compiled separately and on purpose: the core step then
# needs neither the sherpa download nor the voice dependency tree, so it fails
# fast and independently. (The core binary does not pick up sherpa either way —
# a local build with `--features voice` and no `--bin` filter still produces a
# `gqy` with zero sherpa symbols, because nothing outside src/bin/voice.rs
# references it and the linker drops the rest.)
#
# The sherpa archive and its licence come from packaging/common/third-party
# .lock.json so this job pins exactly what the Linux pipeline pins — reading the
# lock rather than hardcoding a URL means a lock bump carries over on its own.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Positive package revision for the artifact filename.
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.MACOS_ARM64_RUNNER || 'macos-15' }}
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: '1.96.1'
      MACOS_TARGET: aarch64-apple-darwin
      PACKAGE_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject a non-positive package revision
        run: |
          if [ "${PACKAGE_REVISION:-0}" -le 0 ]; then
            echo "Package revision must be positive." >&2
            exit 1
          fi

      - name: Install the locked Rust toolchain and macOS target
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" "$MACOS_TARGET"

      - name: Resolve the source version
        id: version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ -z "$version" ]; then echo "Could not read package version." >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building gqy $version for $MACOS_TARGET (revision $PACKAGE_REVISION)."

      - name: Build the core binary offline against the committed lockfile
        run: cargo build --release --locked --bin gqy --target "$MACOS_TARGET"

      - name: Fetch the locked sherpa-onnx static library and licence
        run: |
          set -euo pipefail
          mkdir -p out/archives out/licenses
          python3 - <<'PYTHON'
          import json, pathlib, urllib.parse
          lock = json.loads(pathlib.Path('packaging/common/third-party.lock.json').read_text())
          wanted = {'sherpa-macos': 'out/archives', 'sherpa-onnx-license': 'out/licenses'}
          lines = []
          for record in lock['archives']:
              if record['id'] not in wanted:
                  continue
              if 'macos-arm64' not in record['targets']:
                  raise SystemExit(f"{record['id']} is not declared for macos-arm64")
              # sherpa's build script matches on the original basename.
              name = pathlib.PurePosixPath(urllib.parse.urlsplit(record['url']).path).name
              if record['id'] == 'sherpa-onnx-license':
                  name = 'sherpa-onnx-LICENSE'
              lines.append(f"{record['url']}\t{wanted[record['id']]}/{name}\t{record['sha256']}")
          if len(lines) != len(wanted):
              raise SystemExit('The lock is missing a required macOS voice archive.')
          pathlib.Path('out/downloads.tsv').write_text('\n'.join(lines) + '\n')
          PYTHON
          while IFS=$'\t' read -r url path sha; do
            curl -fL --retry 3 --retry-all-errors -o "$path" "$url"
            echo "${sha}  ${path}" | shasum -a 256 -c -
          done < out/downloads.tsv

      - name: Build the voice front end against the locked sherpa archive
        env:
          SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/out/archives
        run: |
          cargo build --release --locked --features voice --bin gqy-voice \
            --target "$MACOS_TARGET"

      - name: Assemble the unsigned release tarball
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stem="gqy-${version}-${PACKAGE_REVISION}-${MACOS_TARGET}"
          stage="out/stage/${stem}"
          rm -rf out/stage && mkdir -p "$stage"/bin "$stage"/share/gqy/fonts \
            "$stage"/share/gqy/models "$stage"/share/licenses/gqy

          install -m 0755 "target/${MACOS_TARGET}/release/gqy" "$stage/bin/gqy"

          # Runtime assets mirroring the Linux staging layout (fonts, embedding
          # model, memes, scripts and the default knowledge base).
          install -m 0644 assets/fonts/NotoSansCJK-Regular.ttc "$stage/share/gqy/fonts/"
          install -m 0644 assets/fonts/NotoColorEmoji.ttf "$stage/share/gqy/fonts/"
          install -m 0644 assets/fonts/JetBrainsMono-Regular.ttf "$stage/share/gqy/fonts/"
          cp -R assets/models/bge-small-zh-v1.5-int8 "$stage/share/gqy/models/"
          cp -R src/memes "$stage/share/gqy/memes"
          cp -R src/scripts "$stage/share/gqy/scripts"
          mkdir -p "$stage/share/gqy/default-kb"
          cp -R kb "$stage/share/gqy/default-kb/kb"

          # Licenses.
          install -m 0644 LICENSE "$stage/share/licenses/gqy/LICENSE"
          install -m 0644 assets/fonts/NotoSansCJK.LICENSE "$stage/share/licenses/gqy/NotoSansCJK.LICENSE"
          install -m 0644 assets/fonts/NotoColorEmoji.LICENSE "$stage/share/licenses/gqy/NotoColorEmoji.LICENSE"
          install -m 0644 assets/fonts/JetBrainsMono.LICENSE "$stage/share/licenses/gqy/JetBrainsMono.LICENSE"

          mkdir -p out/dist
          tar -czf "out/dist/${stem}.tar.gz" -C out/stage "$stem"
          shasum -a 256 "out/dist/${stem}.tar.gz" | tee "out/dist/${stem}.tar.gz.sha256"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          echo "### macOS build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`${stem}.tar.gz\` (unsigned)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$("${stage}/bin/gqy" --version 2>/dev/null || echo 'gqy (version check skipped)')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Note: local embedding needs \`libonnxruntime.dylib\` present at runtime (e.g. \`brew install onnxruntime\`); it is not bundled." >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble the unsigned voice tarball
        id: package_voice
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stem="gqy-voice-${version}-${PACKAGE_REVISION}-${MACOS_TARGET}"
          stage="out/stage-voice/${stem}"
          rm -rf out/stage-voice && mkdir -p "$stage"/bin "$stage"/share/licenses/gqy-voice

          install -m 0755 "target/${MACOS_TARGET}/release/gqy-voice" "$stage/bin/gqy-voice"

          # Mirrors the voice component in packaging/common/assets.json: the
          # binary plus both licences. Wake/ASR models are not bundled — the
          # daemon downloads them into the state dir on first use.
          install -m 0644 LICENSE "$stage/share/licenses/gqy-voice/LICENSE"
          install -m 0644 out/licenses/sherpa-onnx-LICENSE \
            "$stage/share/licenses/gqy-voice/sherpa-onnx.LICENSE"

          mkdir -p out/dist
          tar -czf "out/dist/${stem}.tar.gz" -C out/stage-voice "$stem"
          shasum -a 256 "out/dist/${stem}.tar.gz" | tee "out/dist/${stem}.tar.gz.sha256"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          echo "- Artifact: \`${stem}.tar.gz\` (unsigned)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$("${stage}/bin/gqy-voice" --version 2>/dev/null || echo 'gqy-voice (version check skipped)')\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Note: the voice front end needs microphone permission for the host terminal, and downloads its wake/ASR models on first use." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.stem }}
          path: |
            out/dist/gqy-${{ steps.version.outputs.version }}-*.tar.gz
            out/dist/gqy-${{ steps.version.outputs.version }}-*.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package_voice.outputs.stem }}
          path: |
            out/dist/gqy-voice-*.tar.gz
            out/dist/gqy-voice-*.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
